name: Ricoweer - kaarten voor WordPress

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,5,6,8,9,12,16,17,18,20 * * *'
      timezone: 'Europe/Amsterdam'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ricoweer-kaart-publicatie
  cancel-in-progress: false

jobs:
  maak_kaarten:
    name: Maak en upload kaarten
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Toon startinformatie
        run: |
          echo "Aanleiding: ${{ github.event_name }}"
          echo "Nederlandse tijd: $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Branch: ${{ github.ref_name }}"
      - name: Haal exportcode op
        uses: actions/checkout@v4
      - name: Activeer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installeer Playwright en Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Controleer exporter
        run: python -m py_compile scripts/maak_kaarten.py
      - name: Hergebruik recente gevalideerde modelscan
        uses: actions/cache/restore@v4
        with:
          path: .cache/rico_national_scan.json
          key: ricoweer-dagscan-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ricoweer-dagscan-v1-
      - name: Genereer kaarten met de Ricoweer-dagmodelmix
        run: python scripts/maak_kaarten.py
        env:
          SOURCE_MAP_URL: https://dcschroder-alt.github.io/Regioweer/weerkaart.html
          OUTPUT_DIR: public
      - name: Bewaar gevalideerde modelscan voor volgende run
        if: ${{ always() && hashFiles('.cache/rico_national_scan.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/rico_national_scan.json
          key: ricoweer-dagscan-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Controleer PNG-bestanden
        run: |
          test -s public/morgen.png
          test -s public/overmorgen.png
          test -s public/randstad-10dagen.png
          test -s public/index.html
      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload de PNG's
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publiceer:
    name: Publiceer de afbeeldingen
    needs: maak_kaarten
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      opnieuw_nodig: ${{ steps.artifact_check.outcome == 'failure' || steps.deployment.outcome == 'failure' }}
    steps:
      - name: Wacht op zichtbaarheid GitHub Pages-artifact
        id: artifact_check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De artifact-registratie kan na de upload vertraagd zichtbaar zijn.
          # De aparte job voorkomt dat de upload en Pages-deploy direct op elkaar volgen.
          sleep 25
          for poging in 1 2 3 4 5 6 7 8; do
            aantal=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length' 2>/dev/null || echo 0)
            echo "Artifact-controle $poging: $aantal github-pages artifact(s) zichtbaar"
            if [ "$aantal" = 1 ]; then exit 0; fi
            if [ "$aantal" != 0 ]; then echo 'Meerdere gelijknamige artifacts: stop'; exit 1; fi
            sleep 15
          done
          echo 'Artifact niet tijdig zichtbaar; laat de bestaande Pages-publicatie staan.'
          exit 1
      - name: Publiceer de afbeeldingen
        id: deployment
        if: ${{ steps.artifact_check.outcome == 'success' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Resultaat van eerste publicatiepoging
        if: always()
        run: |
          echo "Artifact-controle: ${{ steps.artifact_check.outcome }}"
          echo "Eerste Pages-poging: ${{ steps.deployment.outcome }}"
          echo "Een eventuele mislukking wordt in de aparte hersteljob afgehandeld."

  publiceer_opnieuw:
    name: Herstelpoging Pages (zonder nieuwe weerdata)
    needs: [maak_kaarten, publiceer]
    if: ${{ always() && needs.maak_kaarten.result == 'success' && needs.publiceer.outputs.opnieuw_nodig == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Geef GitHub extra verwerkingstijd
        run: sleep 75
      - name: Publiceer hetzelfde artifact opnieuw
        id: deployment
        uses: actions/deploy-pages@v4
