name: Ricoweer - twee kaarten voor WordPress

on:
  workflow_dispatch:
  schedule:
    # Vaste Nederlandse tijd, zomer en winter, na de ochtend- en middagscan.
    # GitHub kan ingeplande taken vertraagd starten of incidenteel overslaan.
    - cron: '31 6,10,14,18,21 * * *'
      timezone: 'Europe/Amsterdam'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ricoweer-kaart-publicatie
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Haal exportcode op
        uses: actions/checkout@v4
      - name: Activeer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer Playwright en Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Controleer exporter
        run: python -m py_compile scripts/maak_kaarten.py
      - name: Genereer morgen en overmorgen met de Ricoweer-dagmodelmix
        run: python scripts/maak_kaarten.py
        env:
          SOURCE_MAP_URL: https://dcschroder-alt.github.io/Regioweer/weerkaart.html
          OUTPUT_DIR: public
      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload alleen de twee PNG's
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publiceer de afbeeldingen
        id: deployment
        uses: actions/deploy-pages@v4
